name: Deploy to Supabase

on:
  push:
    branches:
      - main
    paths:
      - "supabase/**"
  workflow_dispatch:

env:
  SUPABASE_PROJECT_REF: opogckyuwexdlczfvvtb

jobs:
  migrations:
    name: Apply database migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push pending migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  functions:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    needs: migrations
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Remove functions deleted from the repo
        # `functions deploy` only ever pushes/updates — it never deletes a remote function
        # whose folder was removed locally, so those go stale. Best-effort cleanup: never
        # fail the workflow over this, and never delete anything if the local function list
        # comes back empty (that means something's wrong with the listing, not that every
        # function was actually removed).
        continue-on-error: true
        run: |
          set -euo pipefail

          local_functions=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d -not -name '_*' -printf '%f\n' | sort)
          if [ -z "$local_functions" ]; then
            echo "::warning::No local functions found — skipping cleanup as a safety precaution."
            exit 0
          fi

          remote_functions=$(supabase functions list --project-ref "$SUPABASE_PROJECT_REF" -o json | jq -r '.[].slug' | sort)
          if [ -z "$remote_functions" ]; then
            echo "Could not list remote functions — skipping cleanup."
            exit 0
          fi

          orphaned=$(comm -23 <(echo "$remote_functions") <(echo "$local_functions"))
          if [ -z "$orphaned" ]; then
            echo "No orphaned remote functions to remove."
            exit 0
          fi

          echo "Orphaned remote functions (no longer in repo):"
          echo "$orphaned"
          while IFS= read -r fn; do
            [ -z "$fn" ] && continue
            echo "Deleting orphaned function: $fn"
            supabase functions delete "$fn" --project-ref "$SUPABASE_PROJECT_REF"
          done <<< "$orphaned"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
